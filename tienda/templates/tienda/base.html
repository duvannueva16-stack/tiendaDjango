{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Mi Tienda de Ropa{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'tienda/css/estilos.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">Mi Tienda de Ropa</a>
            <form class="d-flex" method="get" action="{% url 'inicio' %}">
                <input class="form-control me-2" type="search" name="q" placeholder="Buscar prenda">
                <button class="btn btn-light" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
